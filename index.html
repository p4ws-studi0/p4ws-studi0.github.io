<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Paws HQ</title>

  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          boxShadow: {
            soft: '0 10px 40px rgba(0,0,0,.08)',
          }
        }
      }
    }
  </script>
</head>


<body
  class="bg-gradient-to-br from-slate-100 to-slate-200
         dark:from-[#0b0f14] dark:to-[#1e2126]
         text-slate-900 dark:text-white
         min-h-screen opacity-0 transition-opacity duration-200"
  data-auth="checking"
>

  <!-- HEADER -->
  <div id="header"></div>


  <!-- LAYOUT -->
  <div class="pt-16 flex">


    <!-- SIDEBAR -->
    <aside
      id="sideMenu"
      class="fixed z-30 w-64 h-screen
             bg-white/10 dark:bg-white/10 glass
             border-r border-white/10
             -translate-x-full
             pt-6 px-5"
    ></aside>


    <!-- MAIN -->
    <main class="flex-1 px-6 py-20 max-w-6xl mx-auto">


      <!-- HERO -->
      <section class="mb-24">

        <div class="max-w-3xl">

          <h1
            class="text-5xl md:text-6xl font-extrabold tracking-tight mb-6"
          >
            Paws HQ
          </h1>

          <h2
            id="welcomeMessage"
            class="opacity-70 text-lg md:text-xl font-semibold mb-10 transition-opacity duration-500"
          ></h2>

        </div>


        <!-- SEARCH -->
        <div class="relative max-w-3xl">

          <input
            id="searchInput"
            type="text"
            placeholder="🔎  Search policies, procedures, tips…"
            class="w-full py-5 px-7 text-lg rounded-2xl

                   glass
                   border border-white/20
                   shadow-soft
                   focus:outline-none focus:ring-2 focus:ring-blue-500

          />

          <div
            id="searchResults"
            class="absolute z-50 mt-4 w-full hidden

                   bg-white/80 dark:bg-[#0b0d12]/95
                   backdrop-blur-xl
                   border border-white/20
                   shadow-2xl
                   overflow-hidden"
          ></div>

        </div>

      </section>



      <!-- RUN CARDS DROPDOWN -->

        <div class="relative inline-block">


          <!-- MAIN BUTTON -->
          <button
            id="runCardsButton"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"

            class="
              inline-flex
              items-center
              gap-2.5

              px-4
              py-2.5

              rounded-xl

              bg-white
              dark:bg-white/10

              hover:bg-slate-50
              dark:hover:bg-white/15

              text-slate-900
              dark:text-white

              text-sm
              font-semibold

              border
              border-black/10
              dark:border-white/15

              shadow-soft

              active:scale-[0.98]

              disabled:opacity-60
              disabled:cursor-wait

              transition-all
              duration-200
            "
          >

            <!-- DOCUMENT ICON -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>

            <span id="runCardsButtonText">
              Run Cards
            </span>

            <!-- CHEVRON -->
            <svg
              id="runCardsChevron"
              xmlns="http://www.w3.org/2000/svg"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="transition-transform duration-200"
            >
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>

          </button>


          <!-- DROPDOWN -->
          <div
            id="runCardsMenu"

            class="
              hidden

              absolute
              left-0
              top-full

              mt-2
              w-44

              rounded-xl

              bg-white
              dark:bg-[#16191f]

              text-slate-900
              dark:text-white

              border
              border-black/10
              dark:border-white/15

              shadow-xl

              overflow-hidden

              z-50
            "
          >


            <!-- TODAY -->
            <button
              type="button"
              data-start="today"

              class="
                run-card-option

                w-full

                flex
                items-center
                gap-3

                px-4
                py-3

                text-left
                text-sm
                font-medium

                hover:bg-slate-100
                dark:hover:bg-white/10

                transition
              "
            >

              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="17"
                height="17"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
                <circle cx="12" cy="16" r="1"/>
              </svg>

              Today

            </button>


            <!-- DIVIDER -->
            <div
              class="h-px bg-black/5 dark:bg-white/10"
            ></div>


            <!-- TOMORROW -->
            <button
              type="button"
              data-start="tomorrow"

              class="
                run-card-option

                w-full

                flex
                items-center
                gap-3

                px-4
                py-3

                text-left
                text-sm
                font-medium

                hover:bg-slate-100
                dark:hover:bg-white/10

                transition
              "
            >

              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="17"
                height="17"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
                <path d="M9 16h6"/>
                <path d="m13 14 2 2-2 2"/>
              </svg>

              Tomorrow

            </button>

          </div>

        </div>

      </section>



      <!-- TOURS -->
      <section class="mb-6">
        <a href="/tours.html"
           class="inline-flex items-center gap-2.5 px-4 py-2.5 rounded-xl
                  bg-white dark:bg-white/10 hover:bg-slate-50 dark:hover:bg-white/15
                  text-sm font-semibold border border-black/10 dark:border-white/15
                  shadow-soft transition focus:outline-none focus:ring-2 focus:ring-blue-500">
          <span aria-hidden="true">🗓</span> Tours
        </a>
      </section>

      <!-- PRIMARY ACTIONS -->
      <section class="mt-4">

        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-3 gap-6">


          <!-- Petcare Procedures -->
          <a
            href="/kb/petcare-procedures"

            class="group rounded-3xl
                   bg-white/60 dark:bg-white/10
                   glass
                   border border-white/10
                   shadow-soft
                   hover:shadow-2xl
                   transition-all duration-300
                   active:scale-[0.98]
                   p-7
                   flex flex-col items-center text-center
                   focus:outline-none focus:ring-2 focus:ring-blue-500"
          >

            <div
              class="text-4xl mb-4 group-hover:scale-110 transition-transform"
            >
              🐶
            </div>

            <h3 class="font-semibold text-base sm:text-lg">
              Petcare Procedures
            </h3>

          </a>


          <!-- Activity Procedures -->
          <a
            href="/kb/activity-procedures"

            class="group rounded-3xl
                   bg-white/60 dark:bg-white/10
                   glass
                   border border-white/10
                   shadow-soft
                   hover:shadow-2xl
                   transition-all duration-300
                   active:scale-[0.98]
                   p-7
                   flex flex-col items-center text-center
                   focus:outline-none focus:ring-2 focus:ring-blue-500"
          >

            <div
              class="text-4xl mb-4 group-hover:scale-110 transition-transform"
            >
              🎾
            </div>

            <h3 class="font-semibold text-base sm:text-lg">
              Activity Procedures
            </h3>

          </a>


          <!-- Gingr Procedures -->
          <a
            href="/kb/gingr-procedures"

            class="group rounded-3xl
                   bg-white/60 dark:bg-white/10
                   glass
                   border border-white/10
                   shadow-soft
                   hover:shadow-2xl
                   transition-all duration-300
                   active:scale-[0.98]
                   p-7
                   flex flex-col items-center text-center
                   focus:outline-none focus:ring-2 focus:ring-blue-500"
          >

            <div
              class="text-4xl mb-4 group-hover:scale-110 transition-transform"
            >
              🧾
            </div>

            <h3 class="font-semibold text-base sm:text-lg">
              Gingr Procedures
            </h3>

          </a>


          <!-- Customer Service -->
          <a
            href="/kb/customer-service-procedures"

            class="group rounded-3xl
                   bg-white/60 dark:bg-white/10
                   glass
                   border border-white/10
                   shadow-soft
                   hover:shadow-2xl
                   transition-all duration-300
                   active:scale-[0.98]
                   p-7
                   flex flex-col items-center text-center
                   focus:outline-none focus:ring-2 focus:ring-blue-500"
          >

            <div
              class="text-4xl mb-4 group-hover:scale-110 transition-transform"
            >
              😀
            </div>

            <h3 class="font-semibold text-base sm:text-lg">
              Customer Service
            </h3>

          </a>


          <!-- Facility Maintenance -->
          <a
            href="/kb/facility-maintenance-procedures"

            class="group rounded-3xl
                   bg-white/60 dark:bg-white/10
                   glass
                   border border-white/10
                   shadow-soft
                   hover:shadow-2xl
                   transition-all duration-300
                   active:scale-[0.98]
                   p-7
                   flex flex-col items-center text-center
                   focus:outline-none focus:ring-2 focus:ring-blue-500"
          >

            <div
              class="text-4xl mb-4 group-hover:scale-110 transition-transform"
            >
              🏠
            </div>

            <h3 class="font-semibold text-base sm:text-lg">
              Facility Maintenance
            </h3>

          </a>


          <!-- Administrative -->
          <a
            href="/kb/administrative-procedures"

            class="group rounded-3xl
                   bg-white/60 dark:bg-white/10
                   glass
                   border border-white/10
                   shadow-soft
                   hover:shadow-2xl
                   transition-all duration-300
                   active:scale-[0.98]
                   p-7
                   flex flex-col items-center text-center
                   focus:outline-none focus:ring-2 focus:ring-blue-500"
          >

            <div
              class="text-4xl mb-4 group-hover:scale-110 transition-transform"
            >
              📌
            </div>

            <h3 class="font-semibold text-base sm:text-lg">
              Administrative Procedures
            </h3>

          </a>

        </div>

      </section>

    </main>

  </div>


  <!-- FOOTER -->
  <div id="footer"></div>



  <!-- PARTIAL LOADERS -->
  <script>

    fetch('/partials/header.html')
      .then(r => r.text())
      .then(html => {

        document.getElementById(
          'header'
        ).innerHTML = html;

        document.dispatchEvent(
          new Event('header:ready')
        );

      });


    fetch('/partials/sidebar.html')
      .then(r => r.text())
      .then(html => {

        document.getElementById(
          'sideMenu'
        ).innerHTML = html;

      });


    fetch('/partials/footer.html')
      .then(r => r.text())
      .then(html => {

        document.getElementById(
          'footer'
        ).innerHTML = html;

      });

  </script>



  <!-- RUN CARDS -->
  <script>

    const RUN_CARDS_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbweMX75_fwIwBlYhBqC1tK43xSksK8abrI5tRo3vVQgrlsC0jbvEBY4CwqayxIs4_FAAg/exec';


    const runCardsButton =
      document.getElementById(
        'runCardsButton'
      );


    const runCardsButtonText =
      document.getElementById(
        'runCardsButtonText'
      );


    const runCardsMenu =
      document.getElementById(
        'runCardsMenu'
      );


    const runCardsChevron =
      document.getElementById(
        'runCardsChevron'
      );



    /********************************************
     * OPEN / CLOSE DROPDOWN
     ********************************************/

    runCardsButton.addEventListener(
      'click',
      function(event) {

        event.stopPropagation();

        const isOpen =
          !runCardsMenu.classList.contains(
            'hidden'
          );


        if (isOpen) {

          closeRunCardsMenu();

        } else {

          openRunCardsMenu();

        }

      }
    );


    function openRunCardsMenu() {

      runCardsMenu
        .classList
        .remove('hidden');


      runCardsChevron
        .classList
        .add('rotate-180');


      runCardsButton
        .setAttribute(
          'aria-expanded',
          'true'
        );

    }


    function closeRunCardsMenu() {

      runCardsMenu
        .classList
        .add('hidden');


      runCardsChevron
        .classList
        .remove('rotate-180');


      runCardsButton
        .setAttribute(
          'aria-expanded',
          'false'
        );

    }


    document.addEventListener(
      'click',
      function() {

        closeRunCardsMenu();

      }
    );


    runCardsMenu.addEventListener(
      'click',
      function(event) {

        event.stopPropagation();

      }
    );



    /********************************************
     * TODAY / TOMORROW
     ********************************************/

    document
      .querySelectorAll(
        '.run-card-option'
      )
      .forEach(
        function(option) {

          option.addEventListener(
            'click',
            function() {

              const startMode =
                option.dataset.start;


              closeRunCardsMenu();


              generateRunCards(
                startMode
              );

            }
          );

        }
      );



    /********************************************
     * GENERATE RUN CARDS
     ********************************************/

    function generateRunCards(
      startMode
    ) {

      /*
       * Open cool Paws loading screen.
       */
      const reportWindow =
        window.open(
          '/report-loading.html',
          '_blank'
        );


      if (!reportWindow) {

        alert(
          'Please allow pop-ups for Paws HQ.'
        );

        return;

      }


      /*
       * Main button loading state.
       */
      runCardsButton.disabled =
        true;


      runCardsButtonText.textContent =
        'Preparing...';



      /*
       * Unique callback.
       */
      const callbackName =
        'runCardsCallback_' +
        Date.now();


      const requestScript =
        document.createElement(
          'script'
        );



      /*
       * Apps Script returns the
       * finished Supabase PDF URL.
       */
      window[callbackName] =
        function(pdfUrl) {

          /*
           * Replace loading screen
           * with native PDF viewer.
           */
          reportWindow.location.replace(
            pdfUrl
          );


          /*
           * Cleanup.
           */
          delete window[
            callbackName
          ];


          requestScript.remove();


          runCardsButton.disabled =
            false;


          runCardsButtonText.textContent =
            'Run Cards';

        };



      /********************************************
       * ERROR
       ********************************************/

      requestScript.onerror =
        function() {

          reportWindow.close();


          delete window[
            callbackName
          ];


          requestScript.remove();


          runCardsButton.disabled =
            false;


          runCardsButtonText.textContent =
            'Run Cards';


          alert(
            'Unable to generate Run Cards.'
          );

        };



      /********************************************
       * CALL APPS SCRIPT
       ********************************************/

      requestScript.src =
        RUN_CARDS_WEB_APP_URL +

        '?start=' +
        encodeURIComponent(
          startMode
        ) +

        '&callback=' +
        encodeURIComponent(
          callbackName
        ) +

        '&t=' +
        Date.now();


      document.head.appendChild(
        requestScript
      );

    }

  </script>



  <!-- SUPABASE SDK -->
  <script
    src="https://unpkg.com/@supabase/supabase-js@2"
  ></script>


  <!-- APP LOGIC -->
  <script src="/script.js"></script>

</body>
</html>
