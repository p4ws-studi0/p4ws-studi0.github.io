<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fb" />
  <title>Preparing Report – Paws HQ</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #f7f8fb; }
    body {
      min-height: 100%; margin: 0; color: #1d1d1f;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 70% 45% at 50% 0%, rgba(215,226,255,.48), transparent 80%),
        linear-gradient(180deg, #fafbff 0%, #f5f6fa 100%);
    }
    #cursor-trail {
      position: fixed; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }
    .page {
      position: relative; z-index: 6;
      pointer-events: none;
      min-height: 100vh; min-height: 100svh;
      display: flex; align-items: center; justify-content: center;
      padding: 32px 20px;
    }
    .report-card {
      position: relative; width: 100%; max-width: 420px;
      pointer-events: none;
      padding: 37px 30px 35px;
      text-align: center;
      background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.10));
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 28px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.75),
        0 24px 70px -25px rgba(38,54,100,.13),
        0 5px 20px -8px rgba(38,54,100,.05);
      animation: cardAppear .55s ease-out both;
    }
    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Full viewport playfield: independent of the glass centerpiece. */
    .chase-stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .dog-shadow {
      position: absolute; left: 0; top: 0;
      width: 78px; height: 11px;
      border-radius: 50%;
      background: rgba(35,52,110,.09);
      filter: blur(7px);
      pointer-events: none;
      will-change: transform;
    }
    .chase-dog {
      position: absolute; top: 0; left: 0;
      width: 118px;
      pointer-events: none;
      will-change: transform;
      z-index: 2;
    }
    .chase-dog img {
      display: block; width: 100%; height: auto;
      image-rendering: pixelated;
      -webkit-user-drag: none;
      filter: drop-shadow(0 7px 8px rgba(38,54,100,.10));
      transform-origin: center center;
    }
    .chase-crown {
      position: absolute; left: 0; top: 0;
      width: 82px; height: 82px;
      pointer-events: none;
      z-index: 3;
      will-change: transform;
      user-select: none; -webkit-user-select: none;
    }
    .chase-crown img {
  filter: drop-shadow(0 1px 1.5px rgba(23,33,45,.35));
      display: block; width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none; -webkit-user-drag: none;
      transform-origin: center bottom;
      animation: crownBounce 4.5s infinite;
      will-change: transform;
    }
    /* The crown follows the cursor automatically — no grabbing needed. */
    @keyframes crownBounce {
      0%, 8%, 75%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      13% { transform: translateY(4px) scale(1.12,.86) rotate(-5deg); }
      21% { transform: translateY(-18px) scale(.90,1.13) rotate(7deg); }
      30% { transform: translateY(-26px) scale(1.04,.97) rotate(-5deg); }
      39% { transform: translateY(-7px) scale(.94,1.08) rotate(3deg); }
      44% { transform: translateY(3px) scale(1.16,.83) rotate(-2deg); }
      52% { transform: translateY(-11px) scale(.96,1.07) rotate(3deg); }
      61% { transform: translateY(0) scale(1.06,.94) rotate(-2deg); }
      68% { transform: translateY(-3px) scale(.99,1.02) rotate(1deg); }
    }
    .report-title {
      margin: 2px 0 10px;
      font-size: 25px; font-weight: 800; line-height: 1.2;
      letter-spacing: -.85px; color: #191b24;
    }
    .report-subtitle {
      margin: 0;
      font-size: 13px; line-height: 1.75;
      color: #777e8d; letter-spacing: -.1px;
    }
    .progress-track {
      position: relative; overflow: hidden;
      width: 118px; height: 4px; margin: 26px auto 0;
      border-radius: 999px;
      background: rgba(65,105,225,.10);
    }
    .progress-track::after {
      content: ''; position: absolute; inset: 0 auto 0 0;
      width: 44%; border-radius: inherit;
      background: linear-gradient(90deg,#8cb6f0,#4169e1,#d4af55);
      animation: progressGlide 1.8s ease-in-out infinite alternate;
    }
    @keyframes progressGlide {
      from { transform: translateX(-100%); }
      to { transform: translateX(245%); }
    }
    @media (max-width: 480px) {
      .page { padding: 24px 18px; }
      .report-card { padding: 33px 23px 30px; border-radius: 25px; }
      .report-title { font-size: 23px; }
      .report-subtitle { font-size: 12px; }
      .chase-dog { width: 108px; }
      .chase-crown { width: 76px; height: 76px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .report-card, .chase-crown img, .progress-track::after { animation: none !important; }
      #cursor-trail { display: none; }
    }
  </style>
</head>

  <!-- Pawprint trail: same shape, four colors, drifting fade as login screen. -->
  <script>
    (() => {
      const canvas = document.getElementById('cursor-trail');
      const ctx = canvas.getContext('2d');
      if (!ctx || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      let width, height, particles = [], animating = false, lastTime = 0;
      let previousX = null, previousY = null;
      const colors = [[65,105,225],[140,182,240],[95,143,220],[212,175,85]];

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = Math.round(width*dpr);
        canvas.height = Math.round(height*dpr);
        ctx.setTransform(dpr,0,0,dpr,0,0);
      }
      resize();
      window.addEventListener('resize', resize);

      function createParticle(x,y) {
        const a = Math.random()*Math.PI*2;
        const speed = .2+Math.random()*.5;
        const life = 500+Math.random()*450;
        return {
          x:x+(Math.random()-.5)*8,
          y:y+(Math.random()-.5)*8,
          vx:Math.cos(a)*speed, vy:Math.sin(a)*speed-.08,
          scale:.55+Math.random()*.4,
          life, maxLife:life,
          color:colors[Math.floor(Math.random()*colors.length)],
          rotation:(Math.random()-.5)*.6
        };
      }
      function emit(x,y) {
        const count = 2+Math.floor(Math.random()*2);
        for(let i=0;i<count;i++) particles.push(createParticle(x,y));
        if(particles.length>80) particles.splice(0,particles.length-80);
        if(!animating) {
          animating=true; lastTime=0; requestAnimationFrame(animate);
        }
      }
      function drawPaw(p,alpha) {
        const [r,g,b]=p.color;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rotation); ctx.scale(p.scale,p.scale);
        ctx.fillStyle=`rgba(${r},${g},${b},${alpha*.12})`;
        const pads=[
          {x:0,y:7,rx:8.6,ry:6.7},
          {x:-7.5,y:-5.5,rx:3.9,ry:5.1},
          {x:-2.4,y:-10.2,rx:3.7,ry:4.9},
          {x:2.8,y:-10.2,rx:3.7,ry:4.9},
          {x:7.8,y:-5.5,rx:3.9,ry:5.1}
        ];
        for(const p2 of pads) {
          ctx.beginPath();ctx.ellipse(p2.x,p2.y,p2.rx*1.65,p2.ry*1.65,0,0,Math.PI*2);ctx.fill();
        }
        ctx.fillStyle=`rgba(${r},${g},${b},${alpha*.88})`;
        ctx.beginPath();ctx.ellipse(0,7,8.4,6.4,0,0,Math.PI*2);ctx.fill();
        for(const p2 of [
          {x:-7.5,y:-5.5,rx:3.5,ry:4.7},
          {x:-2.4,y:-10.2,rx:3.2,ry:4.4},
          {x:2.8,y:-10.2,rx:3.2,ry:4.4},
          {x:7.8,y:-5.5,rx:3.5,ry:4.7}
        ]) {
          ctx.beginPath();ctx.ellipse(p2.x,p2.y,p2.rx,p2.ry,0,0,Math.PI*2);ctx.fill();
        }
        ctx.restore();
      }
      function animate(time) {
        const delta=lastTime?Math.min(time-lastTime,33):16.67;
        lastTime=time;
        const step=delta/16.67;
        ctx.clearRect(0,0,width,height);
        particles=particles.filter(p=>p.life>0);
        for(const p of particles) {
          p.life-=delta;
          p.x+=p.vx*step; p.y+=p.vy*step;
          p.vx*=Math.pow(.986,step);p.vy+=.003*step;
          drawPaw(p,Math.pow(Math.max(0,p.life/p.maxLife),1.55)*.9);
        }
        if(particles.length) requestAnimationFrame(animate);
        else {animating=false;lastTime=0;}
      }
      window.addEventListener('pointermove',e=>{
        if(e.pointerType==='touch')return;
        if(previousX!==null && Math.hypot(e.clientX-previousX,e.clientY-previousY)<7)return;
        previousX=e.clientX;previousY=e.clientY;
        emit(e.clientX,e.clientY);
      },{passive:true});
      window.addEventListener('pointerleave',()=>{previousX=null;previousY=null;});
    })();
  </script>

  <!-- Continuous cursor-following crown and autonomous, springy dog chase. -->
  <script>
    (() => {
      const crown = document.getElementById('chase-crown');
      const dog = document.getElementById('chase-dog');
      const dogImg = dog.querySelector('img');
      const shadow = document.getElementById('dog-shadow');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const rand = (a, b) => a + Math.random() * (b - a);

      let vw, vh, cw, ch, dw, dh;
      let pointerActive = false;
      let pointerX = 0, pointerY = 0;
      let roamX = 0, roamY = 0, roamVX = 0, roamVY = 0;
      let nextTurn = 0;
      let crownX = 0, crownY = 0, crownVX = 0, crownVY = 0;
      let dogX = 0, dogY = 0, dogVX = 0, dogVY = 0;
      let facing = 1, lastTime = 0;

      function dimensions() {
        vw = window.innerWidth;
        vh = window.innerHeight;
        cw = crown.offsetWidth;
        ch = crown.offsetHeight;
        dw = dog.offsetWidth;
        dh = dog.offsetHeight || dw * (240 / 280);
      }

      // The physical edges of the SCREEN, never the edge of the glass card.
      function limits() {
        return {
          x0: 5,
          x1: Math.max(5, vw - cw - 5),
          y0: 31,
          y1: Math.max(31, vh - ch - 7)
        };
      }

      function setRoamHeading(angle, speed = rand(150, 225)) {
        roamVX = Math.cos(angle) * speed;
        roamVY = Math.sin(angle) * speed;
      }

      function roam(dt, t) {
        const b = limits();
        // Continue traveling around the entire screen even while following
        // the cursor, so leaving the window returns to a living animation.
        if (t > nextTurn) {
          const angle = Math.atan2(roamVY, roamVX) + rand(-0.80, 0.80);
          setRoamHeading(angle);
          nextTurn = t + rand(2.2, 4.5);
        }
        roamX += roamVX * dt;
        roamY += roamVY * dt;

        // Only bounce off the REAL viewport boundaries.
        if (roamX <= b.x0) { roamX = b.x0; roamVX = Math.abs(roamVX); }
        if (roamX >= b.x1) { roamX = b.x1; roamVX = -Math.abs(roamVX); }
        if (roamY <= b.y0) { roamY = b.y0; roamVY = Math.abs(roamVY); }
        if (roamY >= b.y1) { roamY = b.y1; roamVY = -Math.abs(roamVY); }
      }

      function moveCrown(dt, t) {
        const b = limits();
        // While a cursor is on the page, the crown orbits its position
        // playfully instead of sticking rigidly to the cursor.
        // These layered waves continue even when the mouse stops moving.
        const waveX = Math.sin(t * 2.45) * 43 + Math.sin(t * 5.1 + 1.1) * 13;
        const waveY = Math.cos(t * 2.05 + .3) * 37 + Math.sin(t * 3.9) * 12;
        const targetX = clamp(
          (pointerActive ? pointerX - cw / 2 + waveX : roamX),
          b.x0, b.x1
        );
        const targetY = clamp(
          (pointerActive ? pointerY - ch / 2 + waveY : roamY),
          b.y0, b.y1
        );

        // Elastic following: charming overshoot and weight, no clicks.
        const k = pointerActive ? 34 : 29;
        const damping = pointerActive ? 8.3 : 7.7;
        crownVX += ((targetX - crownX) * k - crownVX * damping) * dt;
        crownVY += ((targetY - crownY) * k - crownVY * damping) * dt;
        crownX = clamp(crownX + crownVX * dt, b.x0, b.x1);
        crownY = clamp(crownY + crownVY * dt, b.y0, b.y1);
        if ((crownX === b.x0 && crownVX < 0) ||
            (crownX === b.x1 && crownVX > 0)) crownVX *= -.25;
        if ((crownY === b.y0 && crownVY < 0) ||
            (crownY === b.y1 && crownVY > 0)) crownVY *= -.25;

        const tilt = clamp(crownVX * .045, -17, 17) + Math.sin(t * 4.1) * 4;
        const sway = 1 + Math.sin(t * 4.3) * .035;
        crown.style.transform = `translate3d(${crownX}px,${crownY}px,0) rotate(${tilt}deg) scale(${sway})`;
      }

      function chaseDog(dt, t) {
        const cx = crownX + cw * .5;
        const cy = crownY + ch * .5;
        const speed = Math.hypot(crownVX, crownVY);
        // Chase the crown from just behind its current flight direction.
        const aimX = speed > 24 ? crownVX / speed : Math.sin(t * 2.1);
        const aimY = speed > 24 ? crownVY / speed : Math.cos(t * 2.1);
        const idealX = clamp(
          cx - dw * .5 - aimX * 63,
          4, Math.max(4, vw - dw - 4)
        );
        const idealY = clamp(
          cy - dh * .48 - aimY * 34,
          4, Math.max(4, vh - dh - 4)
        );
        const dx = idealX - dogX, dy = idealY - dogY;
        const distance = Math.hypot(dx, dy);
        const runSpeed = clamp(distance * 3.8 + 48, 0, 490);
        const desiredVX = distance > .5 ? dx / distance * runSpeed : 0;
        const desiredVY = distance > .5 ? dy / distance * runSpeed : 0;
        const follow = 1 - Math.exp(-6.6 * dt);
        dogVX += (desiredVX - dogVX) * follow;
        dogVY += (desiredVY - dogVY) * follow;
        dogX = clamp(dogX + dogVX * dt, 4, Math.max(4, vw - dw - 4));
        dogY = clamp(dogY + dogVY * dt, 4, Math.max(4, vh - dh - 4));

        // GIF supplies the running feet. The JS adds cartoon hops and turns.
        const dogMove = Math.hypot(dogVX, dogVY);
        const leap = Math.pow(Math.max(0, Math.sin(t * 15.8)), 2) *
          (dogMove > 50 ? 11 : 5);
        const xToCrown = cx - (dogX + dw / 2);
        if (Math.abs(xToCrown) > 13) facing = Math.sign(xToCrown);
        const lean = clamp(dogVY * .035, -10, 10);
        dog.style.transform = `translate3d(${dogX}px,${dogY - leap}px,0)`;
        dogImg.style.transform = `scaleX(${facing}) rotate(${facing * lean}deg)`;
        shadow.style.transform = `translate3d(${dogX + dw * .18}px,${dogY + dh * .88}px,0) scale(${1 - leap * .012},1)`;
      }

      function animate(timestamp) {
        const dt = lastTime ? Math.min((timestamp - lastTime) / 1000, .033) : 1 / 60;
        lastTime = timestamp;
        const t = timestamp / 1000;
        roam(dt, t);
        moveCrown(dt, t);
        chaseDog(dt, t);
        requestAnimationFrame(animate);
      }

      // No dragging, clicking, tapping, or grabbing involved.
      // Mouse movement ANYWHERE on the screen becomes the new destination.
      window.addEventListener('pointermove', event => {
        if (event.pointerType !== 'mouse' && event.pointerType !== 'pen') return;
        pointerX = event.clientX;
        pointerY = event.clientY;
        pointerActive = true;
      }, { passive: true });

      // Once the pointer leaves, resume sweeping across the full page.
      document.addEventListener('pointerout', event => {
        if (!event.relatedTarget) pointerActive = false;
      });
      window.addEventListener('blur', () => { pointerActive = false; });

      window.addEventListener('resize', () => {
        dimensions();
        const b = limits();
        roamX = clamp(roamX, b.x0, b.x1);
        roamY = clamp(roamY, b.y0, b.y1);
        crownX = clamp(crownX, b.x0, b.x1);
        crownY = clamp(crownY, b.y0, b.y1);
        dogX = clamp(dogX, 4, Math.max(4, vw - dw - 4));
        dogY = clamp(dogY, 4, Math.max(4, vh - dh - 4));
      });

      dimensions();
      const b = limits();
      roamX = clamp(vw * .67, b.x0, b.x1);
      roamY = clamp(vh * .24, b.y0, b.y1);
      crownX = roamX; crownY = roamY;
      dogX = clamp(crownX - dw * 1.15, 4, Math.max(4, vw - dw - 4));
      dogY = clamp(crownY + ch * .55, 4, Math.max(4, vh - dh - 4));
      setRoamHeading(2.4, 185);

      if (reduced) {
        // Respect accessibility preferences with a stationary dog and crown.
        dogImg.src = dogImg.dataset.still;
        crown.style.transform = `translate3d(${crownX}px,${crownY}px,0)`;
        dog.style.transform = `translate3d(${dogX}px,${dogY}px,0)`;
        shadow.style.transform = `translate3d(${dogX + dw * .18}px,${dogY + dh * .88}px,0)`;
      } else {
        requestAnimationFrame(animate);
      }
    })();
  </script>
</body>
