<!DOCTYPE html>
<html lang="en" class="dark overflow-x-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preparing Report – Paws HQ</title>
  <link rel="icon" href="/favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #07080b;
    }

    /* Flat dark backdrop — no vignette */
    .page-background {
      position: fixed;
      inset: 0;
      z-index: -20;
      pointer-events: none;
      background: linear-gradient(180deg, #0b0c11 0%, #07080b 56%, #050609 100%);
    }

    .page-background::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .report-card {
      position: relative;
      width: 100%;
      max-width: 390px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.035));
      box-shadow:
        0 26px 64px rgba(0,0,0,0.46),
        inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .report-card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(147,197,253,0.44), transparent);
      z-index: 5;
    }

    .content {
      padding: 44px 40px 0;
      text-align: center;
    }

    .loader {
      position: relative;
      width: 112px;
      height: 112px;
      margin: 0 auto 30px;
      display: grid;
      place-items: center;
    }

    .loader-ring,
    .loader-ring-secondary {
      position: absolute;
      border-radius: 9999px;
    }

    .loader-ring {
      inset: 0;
      border: 1px solid rgba(255,255,255,0.09);
    }

    .loader-ring::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      border: 1.5px solid transparent;
      border-top-color: rgba(255,255,255,0.92);
      border-right-color: rgba(96,165,250,0.58);
      animation: spin 1.8s linear infinite;
    }

    .loader-ring-secondary {
      inset: 13px;
      border: 1px solid rgba(96,165,250,0.13);
    }

    .loader-ring-secondary::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      border: 1px solid transparent;
      border-bottom-color: rgba(125,211,252,0.72);
      animation: spinReverse 2.7s linear infinite;
    }

    .core {
      position: relative;
      z-index: 2;
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.11);
      background: linear-gradient(145deg, rgba(255,255,255,0.10), rgba(255,255,255,0.035));
      box-shadow:
        0 12px 30px rgba(0,0,0,0.30),
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 0 30px rgba(59,130,246,0.08);
      animation: breathe 2.8s ease-in-out infinite;
    }

    .core img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      mix-blend-mode: screen;
      opacity: 0.96;
      filter: drop-shadow(0 0 10px rgba(147,197,253,0.10));
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spinReverse { to { transform: rotate(-360deg); } }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }

    /* Dedicated bottom shelf for the animation */
    .pet-shelf {
      position: relative;
      min-height: 148px;
      margin-top: 32px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 24px 18px;
      border-top: 1px solid rgba(255,255,255,0.075);
      background: rgba(0,0,0,0.10);
    }

    .pet-shelf::after {
      content: '';
      position: absolute;
      left: 32px;
      right: 32px;
      bottom: 17px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      box-shadow: 0 6px 12px rgba(0,0,0,0.18);
    }

    .pet-shelf img {
      position: relative;
      z-index: 2;
      width: 156px;
      height: auto;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.20));
    }

    @media (max-width: 520px) {
      .report-card {
        max-width: 360px;
        border-radius: 22px;
      }

      .content {
        padding: 38px 30px 0;
      }

      .loader {
        width: 104px;
        height: 104px;
        margin-bottom: 26px;
      }

      .core {
        width: 58px;
        height: 58px;
        border-radius: 17px;
      }

      .core img {
        width: 34px;
        height: 34px;
      }

      .pet-shelf {
        min-height: 136px;
        margin-top: 28px;
        padding-bottom: 16px;
      }

      .pet-shelf img {
        width: 144px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-ring::before,
      .loader-ring-secondary::before,
      .core {
        animation: none !important;
      }
    }
  </style>
</head>
